# MELD 单域 + AP2 M1 配方 — 面向 Agent 在线（mp4 与 ResNet 推理一致）
# 对比三混合 ap2_m1，单域 val Best F1≈0.54、Acc≈0.58（AP1 记录）

model:
  modalities:
    use_video: true
    use_audio: true
    use_physiological: false
    use_text: true
  video:
    backbone: "resnet50"
    pretrained: true
    feature_dim: 713
    output_dim: 512
  audio:
    backbone: "facebook/wav2vec2-base"
    pretrained: true
    feature_dim: 768
    output_dim: 512
  physiological:
    input_dim: 64
    hidden_dim: 256
    num_layers: 2
    output_dim: 512
    use_lstm: true
  text:
    backbone: "bert-base-uncased"
    pretrained: true
    feature_dim: 768
    output_dim: 512
  attention:
    num_heads: 8
    hidden_dim: 512
    num_layers: 3
    dropout: 0.1
    fusion_strategy: "emotion_shift"
    leader_modal: "audio"
    num_gat_layers: 2
    use_fmc_loss: false
  output:
    emotion_classes: 7
    emotion_dimensions: 2
    use_trend_prediction: true
  domain_adaptation:
    enabled: false
  dataset_normalization:
    enabled: false

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  seed: 3407
  num_epochs: 40
  learning_rate: 1e-4
  weight_decay: 1e-5
  warmup_steps: 800
  gradient_clip: 1.0
  optimizer: "adamw"
  scheduler: "cosine"
  loss_weights:
    classification: 1.0
    regression: 0.0
    trend: 0.0
  sampling:
    enabled: true
    mode: "proportional"
    shuffle: true
  loss:
    use_class_balanced: true
    class_balance_beta: 0.999
    use_focal_loss: false
    label_smoothing: 0.05
  pretrain:
    enabled: true
    datasets: ["meld"]
    epochs: 15
  finetune:
    enabled: true
    datasets: ["meld"]
    epochs: 25
    freeze_backbone: false

datasets:
  crema:
    emotion_classes: 6
    emotion_map:
      happy: 0
      sad: 1
      angry: 2
      fear: 3
      disgust: 6
      neutral: 4
    video_format: ".flv"
  meld:
    emotion_classes: 7
    emotion_map:
      joy: 0
      sadness: 1
      anger: 2
      fear: 3
      neutral: 4
      surprise: 5
      disgust: 6
    video_format: ".mp4"
    has_text: true
  mosei:
    emotion_classes: 7
    emotion_map:
      happy: 0
      sad: 1
      angry: 2
      fear: 3
      neutral: 4
      surprise: 5
      disgust: 6
    video_format: ".npy"

data:
  root_dir: "data/"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  video:
    fps: 30
    frame_size: 112
    num_frames: 4
  audio:
    sample_rate: 16000
    duration: 3.0

paths:
  checkpoint_dir: "checkpoints_accuracy_seq/"
  log_dir: "logs_accuracy_seq/"
  output_dir: "outputs_accuracy_seq/"

device: "cuda"
num_workers: 4
pin_memory: true

experiment:
  name: "AP2_M1_meld_only_agent"
  project: "emotion_agent"
  use_tensorboard: true
