model:
  modalities:
    use_video: true
    use_audio: true
    use_physiological: false
    use_text: true
  video:
    backbone: resnet50
    pretrained: true
    feature_dim: 713
    output_dim: 512
    input_type: auto
  audio:
    backbone: facebook/wav2vec2-large-960h
    pretrained: true
    feature_dim: 768
    output_dim: 512
  physiological:
    input_dim: 64
    hidden_dim: 256
    num_layers: 2
    output_dim: 512
    use_lstm: true
  text:
    backbone: roberta-base
    pretrained: true
    feature_dim: 768
    output_dim: 512
    unfreeze_encoder_layers: 1
  attention:
    num_heads: 8
    hidden_dim: 512
    num_layers: 3
    dropout: 0.35
    fusion_strategy: emotion_shift
    leader_modal: text
    num_gat_layers: 2
    use_fmc_loss: false
    use_context_window: true
    modality_dropout: 0.1
  output:
    emotion_classes: 7
    emotion_dimensions: 2
    use_trend_prediction: false
  domain_adaptation:
    enabled: false
  dataset_normalization:
    enabled: false
training:
  batch_size: 1
  gradient_accumulation_steps: 2
  seed: 3407
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 1000
  gradient_clip: 1.0
  optimizer: adamw
  scheduler: cosine
  freeze_backbone_epochs: 8
  backbone_lr_multiplier: 0.01
  save_every_n_epochs: 0
  early_stopping:
    enabled: true
    monitor: val_f1
    patience: 6
    min_delta: 0.002
  loss_weights:
    classification: 1.0
    regression: 0.0
    trend: 0.0
  sampling:
    enabled: true
    mode: uniform
    shuffle: true
  loss:
    use_class_balanced: false
    use_focal_loss: true
    focal_gamma: 2.0
    label_smoothing: 0.10
  pretrain:
    enabled: true
    datasets:
    - meld
    epochs: 50
  finetune:
    enabled: true
    datasets:
    - meld
    epochs: 50
    freeze_backbone: false
datasets:
  crema:
    emotion_classes: 6
    use_native_labels: false
    video_format: .flv
  meld:
    emotion_classes: 7
    use_native_labels: true
    video_format: .mp4
    has_text: true
  mosei:
    emotion_classes: 7
    use_native_labels: false
    video_format: .npy
data:
  root_dir: data/
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  video:
    fps: 30
    frame_size: 112
    num_frames: 4
  audio:
    sample_rate: 16000
    duration: 3.0
  context_window: 3
paths:
  checkpoint_dir: checkpoints_sdavt_v3_r4/
  log_dir: logs_sdavt_v3_r4/
  output_dir: outputs_sdavt_v3_r4/
device: cuda
num_workers: 0
pin_memory: true
experiment:
  name: SDAVT_R4_Agent_M3_M7_deploy
  project: sdavt_v3_r4
  series: sdavt_v3_r4_p3_m3
  use_tensorboard: true
  data_revision: modal_complete_20260603
  arch_revision: fusion_classifier_20260629_combo_antioverfit
  paper_track: true
  deprecated_log_roots:
  - logs_sdavt_v3
  - logs_sdavt_v3_archived
  - logs_accuracy_seq
  - logs_rerun
  phase: p3_m3
  job_id: M3_M7_combo
  log_run_dir: SDAVT_R4_M3_M7_combo
  replace_log_dir: true

# --- Agent 在线部署扩展（非训练字段）---
default_preset: sdavt_meld_v3_r4

temporal_inference:
  enabled: true
  window_sec: 3.0
  stride_sec: 3.0
  max_windows: 10
  max_capture_sec: 30.0
  max_capture_sec_cloudflare: 12.0
  aggregation: recency_weighted
  recency_alpha: 1.5
  batch_windows: true
  short_path_margin_sec: 0.2
  short_path_max_sec: 6.0
  jpeg_prefer_single_window: true

asr_emotion_calibration:
  enabled: true

emotion_arbitration:
  enabled: true
  flat_threshold: 0.38
  low_conf_threshold: 0.42
  neutral_override_threshold: 0.55

chinese_agent:
  enabled: true
  default_language: zh
  text_modality_weight_zh: 0.15
  leader_modal_zh: audio
  skip_text_on_zh_asr: true
  flat_threshold: 0.38
  arbitration:
    positive_asr_over_neutral: true
    llm_assist: false

llm_emotion_assist:
  enabled: false
  trigger_flat_only: true
  min_asr_confidence: 0.35
