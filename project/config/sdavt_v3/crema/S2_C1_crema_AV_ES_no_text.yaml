# S2-C1：CREMA 重训 — AV 无 text（ASR 句子与情感无关）+ AP1 超参
# 修复 S1-C0：AVT 引入文本噪声；ClassBalanced 对均衡数据无益

model:
  modalities:
    use_video: true
    use_audio: true
    use_physiological: false
    use_text: false
  video:
    backbone: "resnet50"
    pretrained: true
    feature_dim: 713
    output_dim: 512
    input_type: "auto"
  audio:
    backbone: "facebook/wav2vec2-base"
    pretrained: true
    feature_dim: 768
    output_dim: 512
  physiological:
    input_dim: 64
    hidden_dim: 256
    num_layers: 2
    output_dim: 512
    use_lstm: true
  text:
    backbone: "bert-base-uncased"
    pretrained: true
    feature_dim: 768
    output_dim: 512
  attention:
    num_heads: 8
    hidden_dim: 512
    num_layers: 3
    dropout: 0.1
    fusion_strategy: "emotion_shift"
    leader_modal: "audio"
    num_gat_layers: 2
    use_fmc_loss: false
  output:
    emotion_classes: 6
    emotion_dimensions: 2
    use_trend_prediction: true
  domain_adaptation:
    enabled: false
  dataset_normalization:
    enabled: false

training:
  batch_size: 1
  gradient_accumulation_steps: 2
  seed: 3407
  num_epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  warmup_steps: 1000
  gradient_clip: 1.0
  optimizer: "adamw"
  scheduler: "cosine"
  freeze_backbone_epochs: 2
  backbone_lr_multiplier: 0.1
  save_every_n_epochs: 0
  early_stopping:
    enabled: true
    monitor: val_f1
    patience: 8
    min_delta: 0.001
  loss_weights:
    classification: 1.0
    regression: 0.0
    trend: 0.0
  sampling:
    enabled: true
    mode: "proportional"
    shuffle: true
  loss:
    use_class_balanced: false
    use_focal_loss: false
    label_smoothing: 0.0
  pretrain:
    enabled: true
    datasets: ["crema"]
    epochs: 50
  finetune:
    enabled: true
    datasets: ["crema"]
    epochs: 50
    freeze_backbone: false

datasets:
  crema:
    emotion_classes: 6
    use_native_labels: true
    video_format: ".flv"
  meld:
    emotion_classes: 7
    use_native_labels: false
    video_format: ".mp4"
  mosei:
    emotion_classes: 7
    use_native_labels: false
    video_format: ".npy"

data:
  root_dir: "data/"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  video:
    fps: 30
    frame_size: 112
    num_frames: 4
  audio:
    sample_rate: 16000
    duration: 3.0

paths:
  checkpoint_dir: "checkpoints_sdavt_v3/"
  log_dir: "logs_sdavt_v3/"
  output_dir: "outputs_sdavt_v3/"

device: "cuda"
num_workers: 4
pin_memory: true

experiment:
  name: "SDAVT_S2_C1_crema_AV_ES_no_text"
  project: "sdavt_v3"
  series: "sdavt_v3_s2"
  use_tensorboard: true
