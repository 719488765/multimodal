# SDAVT v3 S1-M0N：MELD 原生 7 类（无 surprise→anxious 等跨域映射）
# 指标不与 AP1 unified Acc 直接对比

model:
  modalities:
    use_video: true
    use_audio: true
    use_physiological: false
    use_text: true
  video:
    backbone: "resnet50"
    pretrained: true
    feature_dim: 713
    output_dim: 512
    input_type: "auto"
  audio:
    backbone: "facebook/wav2vec2-base"
    pretrained: true
    feature_dim: 768
    output_dim: 512
  physiological:
    input_dim: 64
    hidden_dim: 256
    num_layers: 2
    output_dim: 512
    use_lstm: true
  text:
    backbone: "bert-base-uncased"
    pretrained: true
    feature_dim: 768
    output_dim: 512
  attention:
    num_heads: 8
    hidden_dim: 512
    num_layers: 3
    dropout: 0.1
    fusion_strategy: "emotion_shift"
    leader_modal: "text"
    num_gat_layers: 2
    use_fmc_loss: false
  output:
    emotion_classes: 7
    emotion_dimensions: 2
    use_trend_prediction: true
  domain_adaptation:
    enabled: false
  dataset_normalization:
    enabled: false

training:
  batch_size: 1
  gradient_accumulation_steps: 2
  seed: 3407
  num_epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  gradient_clip: 1.0
  optimizer: "adamw"
  scheduler: "cosine"
  freeze_backbone_epochs: 3
  backbone_lr_multiplier: 0.1
  save_every_n_epochs: 0
  early_stopping:
    enabled: true
    monitor: val_f1
    patience: 5
    min_delta: 0.001
  loss_weights:
    classification: 1.0
    regression: 0.0
    trend: 0.0
  sampling:
    enabled: true
    mode: "proportional"
    shuffle: true
  loss:
    use_class_balanced: true
    class_balance_beta: 0.9999
    use_focal_loss: false
    label_smoothing: 0.0
  pretrain:
    enabled: true
    datasets: ["meld"]
    epochs: 30
  finetune:
    enabled: true
    datasets: ["meld"]
    epochs: 30
    freeze_backbone: false

datasets:
  crema:
    emotion_classes: 6
    use_native_labels: false
    video_format: ".flv"
  meld:
    emotion_classes: 7
    use_native_labels: true
    video_format: ".mp4"
    has_text: true
  mosei:
    emotion_classes: 7
    use_native_labels: false
    video_format: ".npy"

data:
  root_dir: "data/"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  video:
    fps: 30
    frame_size: 224
    num_frames: 8
  audio:
    sample_rate: 16000
    duration: 3.0

paths:
  checkpoint_dir: "checkpoints_sdavt_v3/"
  log_dir: "logs_sdavt_v3/"
  output_dir: "outputs_sdavt_v3/"

device: "cuda"
num_workers: 4
pin_memory: true

experiment:
  name: "SDAVT_S1_M0N_meld_AVT_ES_native"
  project: "sdavt_v3"
  series: "sdavt_v3"
  use_tensorboard: true
